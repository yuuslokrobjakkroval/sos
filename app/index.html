<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Upload a video and get its transcript, captions and speaking speed." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/battambang-400-khmer.woff2" as="font" type="font/woff2" crossorigin />
    <title>Automate — Video to Text</title>
    <script>
      try {
        var savedTheme = localStorage.getItem("automate.theme");
        var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = savedTheme === "light" || savedTheme === "dark" ? savedTheme : systemDark ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.classList.toggle("dark", theme === "dark");
        var savedLocale = localStorage.getItem("automate.locale");
        if (savedLocale === "km" || savedLocale === "en") document.documentElement.lang = savedLocale;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
